services:
  - type: web
    name: api-clientes
    runtime: python
    rootDir: ejercicios_api/06_filtros
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4
    healthCheckPath: /health
    envVars:
      - key: CLIENTES_PASSWORD
        sync: false
  - type: web
    name: calendario-ps5
    runtime: python
    rootDir: ejercicios_api/api_videojuegos
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /api/anios
    envVars:
      - key: API_CLIENTES_HOST
        fromService:
          type: web
          name: api-clientes
          property: host
      - key: CLIENTES_PASSWORD
        sync: false
      - key: FLASK_SECRET_KEY
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
